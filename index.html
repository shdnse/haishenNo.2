    function renderTimeline(items){return `<div class="timeline">${items.map(x=>`<article class="timeline-card reveal"><span class="timeline-dot" aria-hidden="true"></span><div class="card-top"><div><h3 class="card-title">${escapeHTML(x.title)}</h3><div class="meta">${escapeHTML(x.org)} · ${escapeHTML(x.role)}</div></div><div class="meta muted">${escapeHTML(x.time)}</div></div><ul class="bullet-list">${x.bullets.filter(Boolean).map(b=>`<li>${escapeHTML(b)}</li>`).join("")}</ul></article>`).join("")}</div>`}
    function renderProjects(items){return `<div class="project-grid">${items.map((x,i)=>`<article class="project-card reveal"><span class="project-no">PROJECT / ${String(i+1).padStart(2,"0")}</span><h3>${escapeHTML(x.name)}</h3><p class="meta">${escapeHTML(x.type)}</p><p>${escapeHTML(x.description)}</p>${x.result?`<p class="project-result">${escapeHTML(x.result)}</p>`:""}${x.stack?.length?`<div class="stack">${x.stack.map(s=>`<span>${escapeHTML(s)}</span>`).join("")}</div>`:""}${x.playable?`<button class="project-action" type="button" data-open-game>立即试玩 →</button>`:""}</article>`).join("")}</div>`}
    function renderSkills(){$("#skillGrid").innerHTML=resume.skills.filter(g=>g.items?.length).map(g=>`<article class="skill-group reveal"><h3><span aria-hidden="true"></span>${escapeHTML(g.title)}</h3><div class="skill-list">${g.items.map(s=>`<div class="skill-row"><div class="skill-info"><span class="skill-name">${escapeHTML(s.name)}</span><span class="skill-level">${escapeHTML(s.label)}</span></div><div class="skill-track" role="progressbar" aria-label="${escapeHTML(s.name)}熟悉程度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.level}"><div class="skill-fill" style="--level:${s.level}%"></div></div></div>`).join("")}</div></article>`).join("")}
    function renderEducation(){const e=resume.education;if(!e?.school){$("#educationCard").remove()}else{$("#educationCard").innerHTML=`<article class="edu-card reveal"><p class="kicker">Education</p><h3>${escapeHTML(e.school)}</h3><p class="edu-degree">${escapeHTML(e.degree)}</p><p class="meta muted">${escapeHTML(e.period)}</p><p>${escapeHTML(e.description)}</p>${e.courses?.length?`<div class="course-list" aria-label="主修课程">${e.courses.map(c=>`<span>${escapeHTML(c)}</span>`).join("")}</div>`:""}</article>`}const certs=resume.certificates.filter(c=>c.name&&c.image);if(!certs.length){$("#certificateList").remove()}else{$("#certificateList").innerHTML=`<article class="cert-wrap reveal"><p class="kicker">Credentials</p><div class="cert-list">${certs.map(c=>`<figure class="cert-card"><img class="cert-image" src="${escapeHTML(c.image)}" width="1138" height="798" alt="${escapeHTML(c.name)}" loading="lazy" decoding="async"><figcaption class="cert-caption"><span class="cert-name">${escapeHTML(c.name)}</span><span class="meta muted">${escapeHTML(c.issuer)} · ${escapeHTML(c.date)} · ${escapeHTML(c.number)}</span></figcaption></figure>`).join("")}</div></article>`}}
    function renderCTA(){$("#cta").innerHTML=`<h2>期待把学习力，转化为真实项目中的执行力。</h2><p>如果你正在寻找一名认真、可靠、愿意快速学习的实习生或校园项目伙伴，欢迎通过邮箱或微信联系我，也可以先体验我制作的小游戏。</p><div class="cta-actions"><button class="btn" type="button" data-copy-email>${icon.mail}复制邮箱</button><button class="btn" type="button" data-copy-wechat>复制微信</button><button class="btn game" type="button" data-open-game>🐍 打开贪吃蛇</button></div>`}
    function renderFooter(){const year=new Date().getFullYear();$("#footer").innerHTML=`<span><span class="footer-name">© ${year} ${escapeHTML(resume.profile.name)}</span> · 以清晰表达每一次成长</span><span>最后更新：${escapeHTML(resume.updated)}</span>`}
    function setupTheme(){const root=document.documentElement;const stored=localStorage.getItem("resume-theme");const preferred=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";let theme=stored||preferred;const apply=value=>{theme=value;root.dataset.theme=value;$("meta[name=theme-color]").content=value==="dark"?"#07121d":"#f4f7f6";const btn=$("#themeToggle");btn.innerHTML=value==="dark"?icon.sun:icon.moon;btn.setAttribute("aria-label",value==="dark"?"切换到浅色模式":"切换到深色模式")};apply(theme);$("#themeToggle").addEventListener("click",()=>{const next=theme==="dark"?"light":"dark";apply(next);localStorage.setItem("resume-theme",next)})}
    function setupInteractions(){const gameDialog=$("#gameDialog"),gameFrame=$("#gameFrame");const openGame=()=>{gameFrame.src=gameFrame.dataset.src;gameDialog.showModal()};document.addEventListener("click",e=>{const emailButton=e.target.closest("[data-copy-email]");const wechatButton=e.target.closest("[data-copy-wechat]");if(emailButton)copyText(email(),"邮箱");if(wechatButton)copyText(resume.contact.wechat,"微信");if(e.target.closest("[data-print]"))window.print();if(e.target.closest("[data-open-game]"))openGame()});$$('[data-action="email"]').forEach(el=>{const run=()=>copyText(email(),"邮箱");el.addEventListener("click",run);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();run()}})});$$('[data-action="wechat"]').forEach(el=>{const run=()=>copyText(resume.contact.wechat,"微信");el.addEventListener("click",run);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();run()}})});$("#gameDialogClose").addEventListener("click",()=>gameDialog.close());gameDialog.addEventListener("click",e=>{if(e.target===gameDialog)gameDialog.close()});gameDialog.addEventListener("close",()=>{gameFrame.src="about:blank"});const back=$("#backTop");back.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));addEventListener("scroll",()=>back.classList.toggle("show",scrollY>600),{passive:true})}
    function setupObservers(){const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;if(reduced||!("IntersectionObserver" in window)){$$(".reveal").forEach(el=>el.classList.add("visible"))}else{const revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("visible");revealObserver.unobserve(entry.target)}}),{threshold:.09,rootMargin:"0px 0px -30px"});$$(".reveal").forEach(el=>revealObserver.observe(el))}const navLinks=$$(".nav-link");if(navLinks.length&&"IntersectionObserver" in window){const sections=navLinks.map(a=>document.getElementById(a.dataset.section)).filter(Boolean);const sectionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){navLinks.forEach(a=>a.classList.toggle("active",a.dataset.section===entry.target.id))}}),{rootMargin:"-25% 0px -65%",threshold:0});sections.forEach(s=>sectionObserver.observe(s))}}
    function setupHeroMotion(){const hero=$(".hero"),title=$(".kinetic-title");if(!hero||!title||matchMedia("(prefers-reduced-motion:reduce)").matches)return;let frame=0,targetX=0,targetY=0,currentX=0,currentY=0;const apply=(x,y)=>{title.style.setProperty("--title-x",`${(x*9).toFixed(3)}px`);title.style.setProperty("--title-y",`${(y*7).toFixed(3)}px`);title.style.setProperty("--title-echo-x",`${(-x*9).toFixed(3)}px`);title.style.setProperty("--title-echo-y",`${(-y*7).toFixed(3)}px`);title.style.setProperty("--title-rx",`${(-y*3.2).toFixed(3)}deg`);title.style.setProperty("--title-ry",`${(x*4.2).toFixed(3)}deg`);hero.style.setProperty("--hero-bg-x",`${(-x*13).toFixed(3)}px`);hero.style.setProperty("--hero-bg-y",`${(-y*10).toFixed(3)}px`);hero.style.setProperty("--hero-ring-x",`${(x*6).toFixed(3)}px`);hero.style.setProperty("--hero-ring-y",`${(y*5).toFixed(3)}px`)};const tick=()=>{currentX+=(targetX-currentX)*.2;currentY+=(targetY-currentY)*.2;apply(currentX,currentY);if(Math.abs(targetX-currentX)>.0002||Math.abs(targetY-currentY)>.0002){frame=requestAnimationFrame(tick)}else{currentX=targetX;currentY=targetY;apply(currentX,currentY);frame=0}};const queue=()=>{if(!frame)frame=requestAnimationFrame(tick)};hero.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const rect=hero.getBoundingClientRect();targetX=(e.clientX-rect.left)/rect.width-.5;targetY=(e.clientY-rect.top)/rect.height-.5;queue()},{passive:true});hero.addEventListener("pointerleave",()=>{targetX=0;targetY=0;queue()})}
    function init(){renderNav();renderHero();renderContacts();renderHighlights();createTabs("#experienceTabs",resume.experiences,"experience");createTabs("#projectTabs",resume.projects,"project");renderSkills();renderEducation();renderCTA();renderFooter();setupTheme();setupInteractions();setupObservers();setupHeroMotion()}
    init();
  </script>
</body>
</html>
