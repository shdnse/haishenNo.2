<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eaeaea;
    padding: 20px;
    user-select: none;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 16px; }
  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 14px;
  }
  .stat-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 8px 20px;
    text-align: center;
    min-width: 90px;
  }
  .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 1.4rem; font-weight: 700; color: #4ade80; }
  .game-wrapper {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(74, 222, 128, 0.15), 0 8px 32px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    width: min(400px, calc(100vw - 40px));
    height: auto;
    aspect-ratio: 1 / 1;
    background: #0d1117;
    border: 2px solid rgba(74, 222, 128, 0.3);
    border-radius: 14px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(13, 17, 23, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 1.8rem; color: #4ade80; }
  .overlay p { color: #cbd5e1; font-size: 0.95rem; }
  .btn {
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: #0d1117;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,222,128,0.4); }
  .btn:active { transform: translateY(0); }
  .btn.secondary {
    background: rgba(255,255,255,0.1);
    color: #eaeaea;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .hint {
    margin-top: 14px;
    font-size: 0.78rem;
    color: #64748b;
    text-align: center;
    line-height: 1.6;
  }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 16px;
  }
  .dpad button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #4ade80;
    font-size: 1.3rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .dpad button:active { background: rgba(74,222,128,0.25); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }
  @media (max-width: 600px) {
    .dpad { display: grid; }
    h1 { font-size: 1.6rem; }
    .stats { width: 100%; max-width: 400px; gap: 6px; }
    .stat-box { min-width: 0; flex: 1; padding: 8px 6px; }
  }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="subtitle">SNAKE GAME</div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">分数</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">最高分</div>
      <div class="stat-value" id="highScore">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">等级</div>
      <div class="stat-value" id="level">1</div>
    </div>
  </div>

  <div class="game-wrapper">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">准备开始</h2>
      <p id="overlayText">按 空格键 或点击下方按钮开始游戏</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn secondary" id="pauseBtn">暂停</button>
    <button class="btn secondary" id="restartBtn">重新开始</button>
  </div>

  <div class="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>

  <div class="hint">
    方向键 / WASD 控制移动 &nbsp;|&nbsp; 空格键 暂停/继续 &nbsp;|&nbsp; R 键 重新开始
  </div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  let snake, dir, nextDir, food, score, highScore, level, speed, gameLoop, running, paused;

  highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
  highScoreEl.textContent = highScore;

  function init() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    level = 1;
    speed = 140;
    placeFood();
    updateStats();
    draw();
  }

  function placeFood() {
    while (true) {
      const fx = Math.floor(Math.random() * COLS);
      const fy = Math.floor(Math.random() * ROWS);
      if (!snake.some(s => s.x === fx && s.y === fy)) {
        food = {x: fx, y: fy};
        return;
      }
    }
  }

  function updateStats() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    highScoreEl.textContent = highScore;
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
      }
      // level up every 50 points
      const newLevel = Math.floor(score / 50) + 1;
      if (newLevel > level) {
        level = newLevel;
        speed = Math.max(60, 140 - (level - 1) * 10);
        clearInterval(gameLoop);
        gameLoop = setInterval(step, speed);
      }
      placeFood();
      updateStats();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    // background
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * GRID);
      ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }

    // food (pulsing apple)
    const fx = food.x * GRID + GRID / 2;
    const fy = food.y * GRID + GRID / 2;
    const pulse = 1 + Math.sin(Date.now() / 200) * 0.08;
    ctx.save();
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(fx, fy, (GRID / 2 - 2) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // food highlight
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(fx - 3, fy - 3, 2, 0, Math.PI * 2);
    ctx.fill();

    // snake
    snake.forEach((seg, i) => {
      const x = seg.x * GRID;
      const y = seg.y * GRID;
      const isHead = i === 0;
      const t = i / snake.length;

      if (isHead) {
        ctx.save();
        ctx.shadowColor = '#4ade80';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#4ade80';
        roundRect(ctx, x + 1, y + 1, GRID - 2, GRID - 2, 5);
        ctx.fill();
        ctx.restore();
        // eyes
        ctx.fillStyle = '#0d1117';
        const ex = x + GRID / 2, ey = y + GRID / 2;
        const off = 4;
        let e1x, e1y, e2x, e2y;
        if (dir.x === 1) { e1x = ex + 2; e1y = ey - off; e2x = ex + 2; e2y = ey + off; }
        else if (dir.x === -1) { e1x = ex - 2; e1y = ey - off; e2x = ex - 2; e2y = ey + off; }
        else if (dir.y === -1) { e1x = ex - off; e1y = ey - 2; e2x = ex + off; e2y = ey - 2; }
        else { e1x = ex - off; e1y = ey + 2; e2x = ex + off; e2y = ey + 2; }
        ctx.beginPath(); ctx.arc(e1x, e1y, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(e2x, e2y, 2, 0, Math.PI * 2); ctx.fill();
      } else {
        const g = Math.floor(180 - t * 60);
        ctx.fillStyle = `rgb(34, ${g}, 94)`;
        roundRect(ctx, x + 2, y + 2, GRID - 4, GRID - 4, 4);
        ctx.fill();
      }
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function start() {
    if (running && !paused) return;
    if (!running) init();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    pauseBtn.textContent = '暂停';
    clearInterval(gameLoop);
    gameLoop = setInterval(step, speed);
  }

  function pause() {
    if (!running) return;
    if (paused) {
      paused = false;
      overlay.classList.add('hidden');
      pauseBtn.textContent = '暂停';
      gameLoop = setInterval(step, speed);
    } else {
      paused = true;
      clearInterval(gameLoop);
      overlayTitle.textContent = '已暂停';
      overlayText.textContent = '按 空格键 继续游戏';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
      pauseBtn.textContent = '继续';
    }
  }

  function gameOver() {
    clearInterval(gameLoop);
    running = false;
    paused = false;
    overlayTitle.textContent = '游戏结束';
    overlayText.textContent = `本局得分：${score}  |  最高分：${highScore}`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
    pauseBtn.textContent = '暂停';
  }

  function restart() {
    clearInterval(gameLoop);
    running = false;
    paused = false;
    init();
    overlayTitle.textContent = '准备开始';
    overlayText.textContent = '按 空格键 或点击下方按钮开始游戏';
    startBtn.textContent = '开始游戏';
    overlay.classList.remove('hidden');
    pauseBtn.textContent = '暂停';
  }

  function setDir(nx, ny) {
    // prevent reverse
    if (snake && snake.length > 1) {
      if (nx === -dir.x && ny === -dir.y) return;
    }
    nextDir = {x: nx, y: ny};
  }

  // keyboard
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) || ['w','a','s','d',' '].includes(key)) {
      e.preventDefault();
    }
    if (key === 'arrowup' || key === 'w') setDir(0, -1);
    else if (key === 'arrowdown' || key === 's') setDir(0, 1);
    else if (key === 'arrowleft' || key === 'a') setDir(-1, 0);
    else if (key === 'arrowright' || key === 'd') setDir(1, 0);
    else if (key === ' ') { if (!running || paused) start(); else pause(); }
    else if (key === 'r') restart();
  });

  // buttons
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  restartBtn.addEventListener('click', restart);

  // dpad
  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d === 'up') setDir(0, -1);
      else if (d === 'down') setDir(0, 1);
      else if (d === 'left') setDir(-1, 0);
      else if (d === 'right') setDir(1, 0);
      if (!running) start();
    });
  });

  // touch swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 20) setDir(1, 0);
      else if (dx < -20) setDir(-1, 0);
    } else {
      if (dy > 20) setDir(0, 1);
      else if (dy < -20) setDir(0, -1);
    }
    touchStart = null;
  }, {passive: true});

  // init draw
  init();
})();
</script>
</body>
</html>
